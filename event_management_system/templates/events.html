{% extends "base.html" %}
{% block title %}Browse Events - EventHub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h2 class="mb-0"><i class="bi bi-calendar-event"></i> Browse Events</h2>
        <a href="{{ url_for('pages.create_event_page') }}" class="btn btn-brand nav-organizer-only d-none">
            <i class="bi bi-plus-circle"></i> Create Event
        </a>
    </div>

    <div class="card p-3 mb-4 border-0 shadow-sm">
        <div class="row g-2">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by title or venue...">
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button class="btn btn-outline-secondary" id="clearFiltersBtn" title="Clear filters">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="eventsList" class="row g-4">
        <div class="spinner-wrap w-100"><div class="spinner-border text-primary" role="status"></div></div>
    </div>

    <nav class="mt-4" aria-label="Events pagination">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/events.js') }}"></script>
{% endblock %}
